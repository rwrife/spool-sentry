[package]
name = "spool-sentry-toolchain-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "spool-sentry-toolchain-proof"
path = "src/bin/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = "=1.2.0"
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c3"] }
esp-hal = { version = "=1.1.2", features = ["esp32c3"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
